<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Pipe Hitters</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1210; font-family: "Segoe UI", system-ui, sans-serif; color: #e8dcc8; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #overlay, #hud { position: fixed; inset: 0; pointer-events: none; }
    #start {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(8, 10, 9, 0.72); pointer-events: auto; cursor: pointer; z-index: 5; text-align: center; padding: 24px;
    }
    #start h1 { font-weight: 700; letter-spacing: 0.28em; font-size: clamp(22px, 5vw, 42px); margin-bottom: 10px; }
    #start p { opacity: 0.8; font-size: 15px; max-width: 420px; line-height: 1.45; }
    #start.hidden { display: none; }
    #crosshair {
      position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%);
    }
    #crosshair i { position: absolute; background: #f2efe6; box-shadow: 0 0 0 1px rgba(0,0,0,0.45); }
    #crosshair .h { left: 0; right: 0; top: 10px; height: 2px; }
    #crosshair .v { top: 0; bottom: 0; left: 10px; width: 2px; }
    #crosshair .gap { position: absolute; left: 8px; top: 8px; width: 6px; height: 6px; background: #0e1210; opacity: 0.0; }
    #crosshair.hit i { background: #f3c14a; }
    #ammo {
      position: absolute; right: 28px; bottom: 28px; font-variant-numeric: tabular-nums; letter-spacing: 0.08em;
      font-size: 22px; text-shadow: 0 1px 2px #000;
    }
    #ammo span { opacity: 0.55; font-size: 15px; }
    #ammo.reloading { opacity: 0.55; }
    #hint {
      position: absolute; left: 20px; bottom: 20px; font-size: 12px; line-height: 1.55; opacity: 0.72;
      text-shadow: 0 1px 2px #000; max-width: 280px;
    }
    #touch { position: fixed; inset: 0; pointer-events: none; z-index: 4; display: none; }
    #touch.show { display: block; }
    .stick, .tbtn {
      position: absolute; pointer-events: auto; border: 2px solid rgba(232, 220, 200, 0.35);
      background: rgba(14, 18, 16, 0.32);
    }
    .stick { width: 128px; height: 128px; border-radius: 50%; bottom: 28px; }
    #stickL { left: 28px; }
    #stickR { right: 28px; }
    .knob {
      position: absolute; width: 52px; height: 52px; border-radius: 50%; left: 50%; top: 50%;
      transform: translate(-50%, -50%); background: rgba(232, 220, 200, 0.42);
    }
    .tbtn {
      width: 64px; height: 64px; border-radius: 50%; bottom: 170px; display: flex; align-items: center;
      justify-content: center; font-size: 11px; letter-spacing: 0.08em; color: #e8dcc8;
    }
    #btnVault { right: 168px; }
    #btnSlide { right: 96px; }
    .tbtn.active { background: rgba(243, 193, 74, 0.35); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="crosshair"><i class="h"></i><i class="v"></i></div>
    <div id="ammo">30 <span>/ 90</span></div>
    <div id="hint">
      WASD move · Mouse aim · Click shoot<br />
      Shift sprint · Space vault · C / Ctrl slide · R reload
    </div>
  </div>
  <div id="touch">
    <div class="stick" id="stickL"><div class="knob" id="knobL"></div></div>
    <div class="stick" id="stickR"><div class="knob" id="knobR"></div></div>
    <div class="tbtn" id="btnVault">VAULT</div>
    <div class="tbtn" id="btnSlide">SLIDE</div>
  </div>
  <div id="start">
    <h1>PIPE HITTERS</h1>
    <p>Click or tap to start. Move, aim, and shoot in the test yard. This build is the movement and gunfeel core.</p>
  </div>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
import * as THREE from "three";

const canvas = document.getElementById("c");
const startEl = document.getElementById("start");
const ammoEl = document.getElementById("ammo");
const crossEl = document.getElementById("crosshair");
const hintEl = document.getElementById("hint");
const touchEl = document.getElementById("touch");
const stickL = document.getElementById("stickL");
const stickR = document.getElementById("stickR");
const knobL = document.getElementById("knobL");
const knobR = document.getElementById("knobR");
const btnVault = document.getElementById("btnVault");
const btnSlide = document.getElementById("btnSlide");

const MAG = 30;
const RESERVE_MAX = 90;
const FIRE_MS = 95;
const RELOAD_S = 1.45;
const WALK = 5.6;
const SPRINT = 8.6;
const SLIDE_BOOST = 11.2;
const ACCEL = 32;
const FRICTION = 12;
const SLIDE_FRICTION = 4.2;
const RADIUS = 0.36;
const STAND_H = 1.7;
const SLIDE_H = 0.72;
const LOOK_SENS = 0.00215;
const TOUCH_SENS = 0.0034;
const VAULT_MAX = 1.15;
const VAULT_MIN = 0.32;

const keys = Object.create(null);
const mouse = { lx: 0, ly: 0, down: false };
const moveStick = { x: 0, y: 0, id: -1 };
const aimStick = { x: 0, y: 0, id: -1, firing: false };
let touchMode = false;
let pointerReady = false;

const player = {
  pos: new THREE.Vector3(0, 0, 14),
  vel: new THREE.Vector3(),
  yaw: Math.PI,
  bodyYaw: Math.PI,
  pitch: 0.12,
  height: STAND_H,
  stance: "stand",
  slideT: 0,
  vault: null,
  mag: MAG,
  reserve: RESERVE_MAX,
  reloadT: 0,
  lastShot: -1,
  bob: 0,
};

const cam = {
  pos: new THREE.Vector3(0.7, 1.91, 17.15),
  kickP: 0,
  kickY: 0,
  punch: 0,
  roll: 0,
  fov: 62,
};

const tmp = {
  v: new THREE.Vector3(), w: new THREE.Vector3(), q: new THREE.Vector3(),
  r: new THREE.Raycaster(), n: new THREE.Vector2(),
  m: new THREE.Matrix4(), e: new THREE.Euler(), quat: new THREE.Quaternion(),
};
const clock = new THREE.Clock();
const obstacles = [];
const dummies = [];
const tracers = [];
const sparks = [];
let hitFlash = 0;
let muzzleT = 0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8a9aa3);
scene.fog = new THREE.Fog(0x8a9aa3, 22, 58);

const camera = new THREE.PerspectiveCamera(62, 1, 0.08, 120);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(0xc9d4dc, 0x3a3a32, 1.05));
const sun = new THREE.DirectionalLight(0xfff2da, 0.85);
sun.position.set(18, 28, 10);
scene.add(sun);

function boxMesh(w, h, d, color, x, y, z) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshLambertMaterial({ color })
  );
  m.position.set(x, y, z);
  return m;
}

function addObstacle(x, y, z, w, h, d, color, vaultable) {
  const mesh = boxMesh(w, h, d, color, x, y + h * 0.5, z);
  scene.add(mesh);
  const hx = w * 0.5, hz = d * 0.5;
  obstacles.push({
    mesh,
    minX: x - hx, maxX: x + hx,
    minZ: z - hz, maxZ: z + hz,
    y: 0, h, vaultable: !!vaultable,
  });
  return mesh;
}

function buildYard() {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(44, 44),
    new THREE.MeshLambertMaterial({ color: 0x4a5248 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  const pad = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshLambertMaterial({ color: 0x555e52 })
  );
  pad.rotation.x = -Math.PI / 2;
  pad.position.y = 0.01;
  scene.add(pad);

  // borders
  addObstacle(0, 0, -20.4, 41.4, 2.2, 0.8, 0x3d4440, false);
  addObstacle(0, 0, 20.4, 41.4, 2.2, 0.8, 0x3d4440, false);
  addObstacle(-20.4, 0, 0, 0.8, 2.2, 41.4, 0x3d4440, false);
  addObstacle(20.4, 0, 0, 0.8, 2.2, 41.4, 0x3d4440, false);

  // crate clusters
  const crate = 0x6b5a43;
  const crate2 = 0x5a4c38;
  const wall = 0x5a635c;
  const low = 0x7a6d4e;
  addObstacle(-4.2, 0, -1.2, 1.1, 1.0, 1.1, crate, true);
  addObstacle(-3.1, 0, -2.2, 1.1, 1.0, 1.1, crate2, true);
  addObstacle(5.4, 0, 2.0, 1.2, 1.05, 1.2, crate, true);
  addObstacle(6.6, 0, 2.7, 1.0, 0.95, 1.0, crate2, true);
  addObstacle(5.5, 0, 3.3, 1.0, 1.5, 1.0, crate, false);
  addObstacle(-8.5, 0, 6.0, 3.6, 0.85, 0.45, low, true);
  addObstacle(2.0, 0, -7.5, 5.5, 0.8, 0.42, low, true);
  addObstacle(10.5, 0, -4.0, 0.42, 0.9, 4.8, low, true);
  addObstacle(-12.0, 0, -8.0, 0.5, 1.8, 6.0, wall, false);
  addObstacle(-10.5, 0, 11.5, 4.0, 1.9, 0.5, wall, false);
  addObstacle(12.5, 0, 8.5, 1.15, 1.0, 1.15, crate, true);
  addObstacle(13.6, 0, 8.0, 1.0, 0.7, 1.0, crate2, true);
  addObstacle(-14.0, 0, 3.2, 1.2, 0.75, 2.4, low, true);
  addObstacle(0.6, 0, 3.8, 1.05, 0.88, 1.05, crate, true);
  addObstacle(-7.0, 0, -12.0, 2.4, 0.7, 0.4, low, true);
  addObstacle(8.0, 0, -12.5, 1.1, 1.0, 1.1, crate, true);
  addObstacle(-16.0, 0, 12.0, 1.0, 1.0, 1.0, crate2, true);
}

function makeSoldier(body, pants, skin, gunCol) {
  const root = new THREE.Group();
  const torso = boxMesh(0.42, 0.52, 0.28, body, 0, 1.12, 0);
  const pelvis = boxMesh(0.4, 0.18, 0.24, pants, 0, 0.8, 0);
  const head = boxMesh(0.26, 0.26, 0.26, skin, 0, 1.52, 0.02);
  const lArm = boxMesh(0.12, 0.5, 0.12, body, -0.29, 1.08, 0);
  const rArm = boxMesh(0.12, 0.5, 0.12, body, 0.29, 1.08, 0);
  const lLeg = boxMesh(0.15, 0.72, 0.16, pants, -0.12, 0.36, 0);
  const rLeg = boxMesh(0.15, 0.72, 0.16, pants, 0.12, 0.36, 0);
  const gun = new THREE.Group();
  gun.add(boxMesh(0.07, 0.1, 0.42, gunCol, 0, 0, 0.08));
  gun.add(boxMesh(0.05, 0.08, 0.28, 0x2a2a2c, 0, 0.02, 0.38));
  gun.add(boxMesh(0.05, 0.16, 0.08, gunCol, 0, -0.1, -0.06));
  gun.position.set(0.22, 1.12, 0.28);
  root.add(torso, pelvis, head, lArm, rArm, lLeg, rLeg, gun);
  root.userData = { gun, rArm, lArm, lLeg, rLeg, torso, head };
  return root;
}

const soldier = makeSoldier(0x2c4a4a, 0x1c2a2a, 0xd2bfa4, 0x1b1c1e);
scene.add(soldier);

const muzzleLight = new THREE.PointLight(0xffcc77, 0, 4);
scene.add(muzzleLight);
const muzzleFlash = boxMesh(0.08, 0.08, 0.18, 0xffe9a6, 0, 0, 0);
muzzleFlash.material = new THREE.MeshBasicMaterial({ color: 0xffe6a0 });
muzzleFlash.visible = false;
scene.add(muzzleFlash);

function makeDummy(x, z, facing) {
  const root = makeSoldier(0xb45a34, 0x6a3a28, 0xe2c9a8, 0x2a2420);
  root.position.set(x, 0, z);
  root.rotation.y = facing;
  scene.add(root);
  const d = {
    root, x, z, facing, homeX: x, homeZ: z,
    hp: 3, max: 3, state: "idle", t: 0,
    flash: 0, strafe: Math.random() * Math.PI * 2,
    mats: [],
  };
  root.traverse((o) => { if (o.isMesh) d.mats.push(o.material); });
  dummies.push(d);
  return d;
}

makeDummy(-6.2, -3.5, 0.4);
makeDummy(3.8, -4.2, -0.3);
makeDummy(9.2, 1.4, -1.2);
makeDummy(-10.5, 8.2, 2.4);
makeDummy(14.0, -8.0, 1.0);
makeDummy(-2.0, -14.0, 0.1);
makeDummy(7.5, 12.0, 3.2);

for (let i = 0; i < 18; i++) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.04, 0.04, 1),
    new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0 })
  );
  m.visible = false;
  scene.add(m);
  tracers.push({ mesh: m, life: 0 });
}
for (let i = 0; i < 14; i++) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 0.1, 0.1),
    new THREE.MeshBasicMaterial({ color: 0xf0d090 })
  );
  m.visible = false;
  scene.add(m);
  sparks.push({ mesh: m, life: 0 });
}

buildYard();

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function damp(cur, target, lambda, dt) {
  return cur + (target - cur) * (1 - Math.exp(-lambda * dt));
}
function dampV(cur, target, lambda, dt) {
  cur.lerp(target, 1 - Math.exp(-lambda * dt));
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener("resize", resize);
resize();

function isTouchDevice() {
  return window.matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 1;
}

function showTouch(on) {
  touchMode = on;
  touchEl.classList.toggle("show", on);
  hintEl.style.display = on ? "none" : "block";
}

function bindKeys() {
  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (["Space", "AltLeft", "AltRight"].includes(e.code)) e.preventDefault();
    if (e.code === "KeyR") startReload();
    if (e.code === "KeyC" || e.code === "ControlLeft" || e.code === "ControlRight") trySlide();
    if (e.code === "Space") tryVault();
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });
  window.addEventListener("contextmenu", (e) => e.preventDefault());
  window.addEventListener("mousedown", (e) => {
    if (e.button === 0) mouse.down = true;
  });
  window.addEventListener("mouseup", (e) => {
    if (e.button === 0) mouse.down = false;
  });
  document.addEventListener("mousemove", (e) => {
    if (!pointerReady || touchMode) return;
    if (document.pointerLockElement !== canvas) return;
    mouse.lx += e.movementX;
    mouse.ly += e.movementY;
  });
  document.addEventListener("pointerlockchange", () => {
    pointerReady = document.pointerLockElement === canvas;
    startEl.classList.toggle("hidden", pointerReady || touchMode);
  });
}

function startPlay() {
  if (isTouchDevice() || touchMode) {
    showTouch(true);
    pointerReady = true;
    startEl.classList.add("hidden");
    return;
  }
  canvas.requestPointerLock();
}

startEl.addEventListener("click", startPlay);
startEl.addEventListener("touchstart", (e) => {
  e.preventDefault();
  showTouch(true);
  startPlay();
}, { passive: false });

function stickPos(el, ev) {
  const r = el.getBoundingClientRect();
  return { x: ev.clientX - (r.left + r.width / 2), y: ev.clientY - (r.top + r.height / 2) };
}
function setKnob(knob, x, y, max) {
  const l = Math.hypot(x, y);
  const s = l > max ? max / l : 1;
  knob.style.transform = `translate(calc(-50% + ${x * s}px), calc(-50% + ${y * s}px))`;
}
function resetKnob(knob) {
  knob.style.transform = "translate(-50%, -50%)";
}

function onTouchStart(e) {
  if (!touchMode) {
    showTouch(true);
    pointerReady = true;
    startEl.classList.add("hidden");
  }
  for (const t of e.changedTouches) {
    const ev = { clientX: t.clientX, clientY: t.clientY };
    const vaultR = btnVault.getBoundingClientRect();
    const slideR = btnSlide.getBoundingClientRect();
    if (t.clientX >= vaultR.left && t.clientX <= vaultR.right && t.clientY >= vaultR.top && t.clientY <= vaultR.bottom) {
      btnVault.classList.add("active");
      tryVault();
      continue;
    }
    if (t.clientX >= slideR.left && t.clientX <= slideR.right && t.clientY >= slideR.top && t.clientY <= slideR.bottom) {
      btnSlide.classList.add("active");
      trySlide();
      continue;
    }
    const mid = window.innerWidth * 0.5;
    if (t.clientX < mid && moveStick.id < 0) {
      moveStick.id = t.identifier;
      const p = stickPos(stickL, ev);
      const max = 46;
      const len = Math.hypot(p.x, p.y);
      const k = len > max ? max / len : 1;
      moveStick.x = (p.x * k) / max;
      moveStick.y = (p.y * k) / max;
      setKnob(knobL, p.x, p.y, max);
    } else if (t.clientX >= mid && aimStick.id < 0) {
      aimStick.id = t.identifier;
      aimStick.firing = true;
      aimStick.x = 0;
      aimStick.y = 0;
      setKnob(knobR, 0, 0, 46);
    }
  }
}
function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const ev = { clientX: t.clientX, clientY: t.clientY };
    if (t.identifier === moveStick.id) {
      const p = stickPos(stickL, ev);
      const max = 46;
      const len = Math.hypot(p.x, p.y);
      const k = len > max ? max / len : 1;
      moveStick.x = (p.x * k) / max;
      moveStick.y = (p.y * k) / max;
      setKnob(knobL, p.x, p.y, max);
    } else if (t.identifier === aimStick.id) {
      const p = stickPos(stickR, ev);
      const max = 46;
      const len = Math.hypot(p.x, p.y);
      const k = len > max ? max / len : 1;
      aimStick.x = (p.x * k) / max;
      aimStick.y = (p.y * k) / max;
      setKnob(knobR, p.x, p.y, max);
    }
  }
}
function endTouch(id) {
  if (id === moveStick.id) {
    moveStick.id = -1; moveStick.x = 0; moveStick.y = 0; resetKnob(knobL);
  }
  if (id === aimStick.id) {
    aimStick.id = -1; aimStick.x = 0; aimStick.y = 0; aimStick.firing = false; resetKnob(knobR);
  }
}
function onTouchEnd(e) {
  btnVault.classList.remove("active");
  btnSlide.classList.remove("active");
  for (const t of e.changedTouches) endTouch(t.identifier);
}

touchEl.addEventListener("touchstart", onTouchStart, { passive: false });
touchEl.addEventListener("touchmove", onTouchMove, { passive: false });
touchEl.addEventListener("touchend", onTouchEnd);
touchEl.addEventListener("touchcancel", onTouchEnd);
window.addEventListener("touchstart", (e) => {
  if (!startEl.classList.contains("hidden")) return;
  if (!touchMode) {
    showTouch(true);
    pointerReady = true;
  }
}, { passive: true });

bindKeys();

function wishDir() {
  let x = 0, z = 0;
  if (touchMode) {
    x += moveStick.x;
    z -= moveStick.y;
  } else {
    if (keys.KeyW || keys.ArrowUp) z += 1;
    if (keys.KeyS || keys.ArrowDown) z -= 1;
    if (keys.KeyA || keys.ArrowLeft) x -= 1;
    if (keys.KeyD || keys.ArrowRight) x += 1;
  }
  const len = Math.hypot(x, z);
  if (len > 1) { x /= len; z /= len; }
  const c = Math.cos(player.yaw), s = Math.sin(player.yaw);
  return { x: x * c + z * s, z: -x * s + z * c, lx: x, lz: z, mag: Math.min(1, len) };
}

function sprinting(wish) {
  if (player.stance !== "stand") return false;
  const key = keys.ShiftLeft || keys.ShiftRight;
  const mobileSprint = touchMode && wish.mag > 0.85 && wish.lz > 0.35;
  return (key || mobileSprint) && wish.mag > 0.15;
}

function collideXZ(x, z, rad) {
  for (let i = 0; i < 3; i++) {
    for (const o of obstacles) {
      const cx = clamp(x, o.minX, o.maxX);
      const cz = clamp(z, o.minZ, o.maxZ);
      let dx = x - cx, dz = z - cz;
      const d2 = dx * dx + dz * dz;
      if (d2 >= rad * rad) continue;
      if (d2 < 1e-8) {
        const left = x - o.minX + rad, right = o.maxX - x + rad, down = z - o.minZ + rad, up = o.maxZ - z + rad;
        const m = Math.min(left, right, down, up);
        if (m === left) x = o.minX - rad;
        else if (m === right) x = o.maxX + rad;
        else if (m === down) z = o.minZ - rad;
        else z = o.maxZ + rad;
      } else {
        const d = Math.sqrt(d2);
        const f = rad / d;
        x = cx + dx * f;
        z = cz + dz * f;
      }
    }
  }
  return { x, z };
}

function blockedAt(x, z, rad) {
  for (const o of obstacles) {
    if (o.h < 0.35) continue;
    const cx = clamp(x, o.minX, o.maxX);
    const cz = clamp(z, o.minZ, o.maxZ);
    const dx = x - cx, dz = z - cz;
    if (dx * dx + dz * dz < rad * rad * 0.85) return true;
  }
  return false;
}

function findVault() {
  const dirx = Math.sin(player.yaw);
  const dirz = Math.cos(player.yaw);
  let best = null;
  for (const o of obstacles) {
    if (!o.vaultable || o.h < VAULT_MIN || o.h > VAULT_MAX) continue;
    const cx = clamp(player.pos.x, o.minX, o.maxX);
    const cz = clamp(player.pos.z, o.minZ, o.maxZ);
    const dx = cx - player.pos.x, dz = cz - player.pos.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 1.25 || dist < 0.15) continue;
    const toward = (dx * dirx + dz * dirz) / (dist || 1);
    if (toward < 0.25) continue;
    const depth = Math.abs(dx * dirx + dz * dirz);
    const landX = player.pos.x + dirx * (dist + Math.max(o.maxX - o.minX, o.maxZ - o.minZ) * 0.55 + RADIUS + 0.18);
    const landZ = player.pos.z + dirz * (dist + Math.max(o.maxX - o.minX, o.maxZ - o.minZ) * 0.55 + RADIUS + 0.18);
    if (blockedAt(landX, landZ, RADIUS * 0.9)) continue;
    if (!best || dist < best.dist) best = { o, dist, landX, landZ, h: o.h };
  }
  return best;
}

function tryVault() {
  if (player.vault || player.stance === "slide") return;
  const hit = findVault();
  if (!hit) return;
  player.stance = "vault";
  player.vault = {
    t: 0,
    dur: 0.38,
    sx: player.pos.x, sz: player.pos.z,
    ex: hit.landX, ez: hit.landZ,
    h: hit.h,
  };
  player.vel.set(0, 0, 0);
}

function trySlide() {
  if (player.stance !== "stand" || player.vault) return;
  const spd = Math.hypot(player.vel.x, player.vel.z);
  const dirx = Math.sin(player.yaw);
  const dirz = Math.cos(player.yaw);
  if (spd < 1.2) {
    player.vel.x += dirx * 6;
    player.vel.z += dirz * 6;
  } else {
    const k = SLIDE_BOOST / spd;
    player.vel.x *= Math.max(1, k * 0.92);
    player.vel.z *= Math.max(1, k * 0.92);
    const boost = SLIDE_BOOST;
    const nx = player.vel.x, nz = player.vel.z;
    const n = Math.hypot(nx, nz) || 1;
    player.vel.x = (nx / n) * Math.max(n, boost);
    player.vel.z = (nz / n) * Math.max(n, boost);
  }
  player.stance = "slide";
  player.slideT = 0.58;
}

function startReload() {
  if (player.reloadT > 0 || player.mag >= MAG || player.reserve <= 0) return;
  player.reloadT = RELOAD_S;
}

function applyFriction(dt, amount) {
  const s = Math.hypot(player.vel.x, player.vel.z);
  if (s < 0.02) { player.vel.x = 0; player.vel.z = 0; return; }
  const drop = Math.max(s * amount * dt, amount * 0.25 * dt);
  const ns = Math.max(s - drop, 0);
  player.vel.x *= ns / s;
  player.vel.z *= ns / s;
}

function accelerate(wx, wz, speed, dt) {
  const wishX = wx * speed, wishZ = wz * speed;
  const cur = player.vel.x * wx + player.vel.z * wz;
  const add = speed - cur;
  if (add <= 0) return;
  const acc = Math.min(add, ACCEL * dt * (speed / WALK));
  player.vel.x += wx * acc;
  player.vel.z += wz * acc;
}

function updateLook(dt) {
  if (touchMode) {
    player.yaw -= aimStick.x * TOUCH_SENS * 860 * dt;
    player.pitch += aimStick.y * TOUCH_SENS * 860 * dt;
  } else {
    player.yaw -= mouse.lx * LOOK_SENS;
    player.pitch += mouse.ly * LOOK_SENS;
    mouse.lx = 0;
    mouse.ly = 0;
  }
  player.pitch = clamp(player.pitch, -1.15, 1.25);
}

function updateMove(dt) {
  if (player.vault) {
    const v = player.vault;
    v.t += dt;
    const u = clamp(v.t / v.dur, 0, 1);
    const e = u * u * (3 - 2 * u);
    player.pos.x = v.sx + (v.ex - v.sx) * e;
    player.pos.z = v.sz + (v.ez - v.sz) * e;
    const arc = Math.sin(u * Math.PI);
    player.pos.y = (v.h + 0.28) * arc;
    if (u >= 1) {
      player.pos.y = 0;
      const landed = collideXZ(player.pos.x, player.pos.z, RADIUS);
      player.pos.x = landed.x; player.pos.z = landed.z;
      player.vault = null;
      player.stance = "stand";
      const dirx = Math.sin(player.yaw), dirz = Math.cos(player.yaw);
      player.vel.x = dirx * 5.2;
      player.vel.z = dirz * 5.2;
    }
    return;
  }

  const wish = wishDir();
  const isSprint = sprinting(wish);
  const speed = player.stance === "slide" ? SLIDE_BOOST : (isSprint ? SPRINT : WALK);

  if (player.stance === "slide") {
    player.slideT -= dt;
    applyFriction(dt, SLIDE_FRICTION);
    if (player.slideT <= 0) player.stance = "stand";
  } else if (wish.mag > 0.04) {
    applyFriction(dt, FRICTION * 0.45);
    const inv = 1 / (wish.mag || 1);
    accelerate(wish.x, wish.z, speed * wish.mag, dt);
  } else {
    applyFriction(dt, FRICTION * 1.35);
  }

  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  const hit = collideXZ(player.pos.x, player.pos.z, RADIUS);
  if (hit.x !== player.pos.x) player.vel.x = 0;
  if (hit.z !== player.pos.z) player.vel.z = 0;
  player.pos.x = hit.x;
  player.pos.z = hit.z;
  player.pos.y = 0;

  const spd = Math.hypot(player.vel.x, player.vel.z);
  player.bob += spd * dt * 1.7;
}

function muzzleWorld(out) {
  const g = soldier.userData.gun;
  g.updateWorldMatrix(true, false);
  out.set(0, 0, 0.62).applyMatrix4(g.matrixWorld);
  return out;
}

function spawnTracer(ax, ay, az, bx, by, bz) {
  const t = tracers.find((o) => o.life <= 0) || tracers[0];
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const len = Math.hypot(dx, dy, dz) || 0.01;
  t.mesh.position.set((ax + bx) * 0.5, (ay + by) * 0.5, (az + bz) * 0.5);
  t.mesh.scale.set(1, 1, len);
  t.mesh.lookAt(bx, by, bz);
  t.mesh.material.opacity = 0.95;
  t.mesh.visible = true;
  t.life = 0.09;
}

function spawnSpark(x, y, z) {
  const s = sparks.find((o) => o.life <= 0) || sparks[0];
  s.mesh.position.set(x, y, z);
  s.mesh.visible = true;
  s.mesh.scale.setScalar(1);
  s.life = 0.12;
}

function dummyHitTest(origin, dir, maxD) {
  let best = null, bestD = maxD;
  const o = origin, d = dir;
  for (const dum of dummies) {
    if (dum.state === "down") continue;
    const cx = dum.root.position.x;
    const cy = 0.9;
    const cz = dum.root.position.z;
    const px = cx - o.x, py = cy - o.y, pz = cz - o.z;
    const t = px * d.x + py * d.y + pz * d.z;
    if (t < 0 || t > bestD) continue;
    const qx = o.x + d.x * t - cx;
    const qy = o.y + d.y * t - cy;
    const qz = o.z + d.z * t - cz;
    const rad = 0.55;
    const hh = 1.05;
    if (qx * qx + qz * qz < rad * rad && Math.abs(qy) < hh) {
      bestD = t;
      best = dum;
    }
  }
  return best ? { dum: best, dist: bestD } : null;
}

function worldHit(origin, dir, maxD) {
  let best = maxD, pt = null;
  for (const o of obstacles) {
    const min = tmp.v.set(o.minX, 0, o.minZ);
    const max = tmp.w.set(o.maxX, o.h, o.maxZ);
    const invX = 1 / (dir.x || 1e-8), invY = 1 / (dir.y || 1e-8), invZ = 1 / (dir.z || 1e-8);
    let t1 = (min.x - origin.x) * invX, t2 = (max.x - origin.x) * invX;
    let tmin = Math.min(t1, t2), tmax = Math.max(t1, t2);
    t1 = (min.y - origin.y) * invY; t2 = (max.y - origin.y) * invY;
    tmin = Math.max(tmin, Math.min(t1, t2));
    tmax = Math.min(tmax, Math.max(t1, t2));
    t1 = (min.z - origin.z) * invZ; t2 = (max.z - origin.z) * invZ;
    tmin = Math.max(tmin, Math.min(t1, t2));
    tmax = Math.min(tmax, Math.max(t1, t2));
    if (tmax >= tmin && tmin > 0.05 && tmin < best) {
      best = tmin;
      pt = origin.clone().addScaledVector(dir, tmin);
    }
  }
  return { dist: best, pt };
}

function hurtDummy(dum) {
  dum.hp -= 1;
  dum.flash = 0.12;
  hitFlash = 0.09;
  if (dum.hp <= 0) {
    dum.state = "down";
    dum.t = 0;
    dum.hp = 0;
  }
}

function fire() {
  if (!pointerReady) return;
  if (player.reloadT > 0 || player.stance === "vault") return;
  if (player.mag <= 0) { startReload(); return; }
  const now = performance.now();
  if (now - player.lastShot < FIRE_MS) return;
  player.lastShot = now;
  player.mag -= 1;
  cam.kickP += 0.028;
  cam.kickY += (Math.random() - 0.5) * 0.018;
  cam.punch += 0.12;
  muzzleT = 0.045;

  const origin = camera.position;
  const dir = tmp.q.set(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
  const world = worldHit(origin, dir, 80);
  const dum = dummyHitTest(origin, dir, world.dist);
  let end;
  if (dum) {
    end = origin.clone().addScaledVector(dir, dum.dist);
    hurtDummy(dum.dum);
  } else if (world.pt) {
    end = world.pt;
  } else {
    end = origin.clone().addScaledVector(dir, 70);
  }
  const muz = muzzleWorld(tmp.w);
  spawnTracer(muz.x, muz.y, muz.z, end.x, end.y, end.z);
  spawnSpark(end.x, end.y, end.z);
  if (player.mag <= 0) startReload();
}

function updateShoot(dt) {
  const holding = touchMode ? aimStick.firing : mouse.down;
  if (holding) fire();
  if (player.reloadT > 0) {
    player.reloadT -= dt;
    if (player.reloadT <= 0) {
      const need = MAG - player.mag;
      const take = Math.min(need, player.reserve);
      player.mag += take;
      player.reserve -= take;
      player.reloadT = 0;
    }
  }
}

function updateDummies(dt) {
  for (const d of dummies) {
    if (d.flash > 0) {
      d.flash -= dt;
      const on = d.flash > 0;
      for (const m of d.mats) m.emissive.setHex(on ? 0x665533 : 0x000000);
    }
    if (d.state === "down") {
      d.t += dt;
      const k = clamp(d.t / 0.35, 0, 1);
      d.root.rotation.x = k * 1.45;
      d.root.position.y = 0;
      if (d.t > 2.4) {
        d.state = "idle";
        d.hp = d.max;
        d.root.rotation.x = 0;
        d.root.position.set(d.homeX, 0, d.homeZ);
      }
      continue;
    }
    d.strafe += dt * 0.7;
    const ox = Math.sin(d.strafe) * 0.55;
    const oz = Math.cos(d.strafe * 0.7) * 0.35;
    const nx = d.homeX + ox, nz = d.homeZ + oz;
    if (!blockedAt(nx, nz, 0.4)) {
      d.root.position.x = nx;
      d.root.position.z = nz;
    }
    const dx = player.pos.x - d.root.position.x;
    const dz = player.pos.z - d.root.position.z;
    const want = Math.atan2(dx, dz);
    d.root.rotation.y = damp(d.root.rotation.y, want, 3.2, dt);
  }
}

function updateFx(dt) {
  for (const t of tracers) {
    if (t.life <= 0) { t.mesh.visible = false; continue; }
    t.life -= dt;
    t.mesh.material.opacity = Math.max(0, t.life / 0.09);
    if (t.life <= 0) t.mesh.visible = false;
  }
  for (const s of sparks) {
    if (s.life <= 0) { s.mesh.visible = false; continue; }
    s.life -= dt;
    const u = s.life / 0.12;
    s.mesh.scale.setScalar(0.6 + (1 - u) * 1.4);
    s.mesh.material.opacity = u;
    s.mesh.material.transparent = true;
    if (s.life <= 0) s.mesh.visible = false;
  }
  if (muzzleT > 0) {
    muzzleT -= dt;
    const g = soldier.userData.gun;
    g.updateWorldMatrix(true, false);
    tmp.v.set(0, 0, 0.55).applyMatrix4(g.matrixWorld);
    muzzleFlash.position.copy(tmp.v);
    muzzleFlash.quaternion.copy(g.getWorldQuaternion(tmp.quat));
    muzzleFlash.visible = true;
    muzzleLight.position.copy(tmp.v);
    muzzleLight.intensity = 3.2;
  } else {
    muzzleFlash.visible = false;
    muzzleLight.intensity = 0;
  }
  if (hitFlash > 0) hitFlash -= dt;
  cam.kickP = damp(cam.kickP, 0, 9, dt);
  cam.kickY = damp(cam.kickY, 0, 8, dt);
  cam.punch = damp(cam.punch, 0, 10, dt);
}

function updateSoldier(dt) {
  const targetYaw = player.yaw;
  player.bodyYaw = damp(player.bodyYaw, targetYaw, 11, dt);
  soldier.position.set(player.pos.x, player.pos.y, player.pos.z);
  soldier.rotation.set(0, player.bodyYaw, 0);
  const u = soldier.userData;
  const spd = Math.hypot(player.vel.x, player.vel.z);
  if (player.stance === "slide") {
    soldier.rotation.x = 1.05;
    soldier.position.y = 0.15;
    u.gun.rotation.x = 0.15;
  } else if (player.vault) {
    const k = player.vault.t / player.vault.dur;
    soldier.rotation.x = -0.2 * Math.sin(k * Math.PI);
    u.lLeg.rotation.x = -0.8;
    u.rLeg.rotation.x = 0.5;
  } else {
    soldier.rotation.x = 0;
    const bob = Math.sin(player.bob * 2 * Math.PI) * Math.min(1, spd / 5);
    u.lLeg.rotation.x = bob * 0.55;
    u.rLeg.rotation.x = -bob * 0.55;
    u.lArm.rotation.x = -bob * 0.25;
    u.rArm.rotation.x = bob * 0.2;
    u.gun.rotation.x = player.pitch * 0.15;
    u.torso.position.y = 1.12 + Math.abs(bob) * 0.02;
  }
}

function updateCamera(dt) {
  const pitch = player.pitch + cam.kickP;
  const yaw = player.yaw + cam.kickY;
  const standH = player.stance === "slide" ? 0.72 : 1.52;
  const shoulder = 0.7;
  const dist = 3.15 + cam.punch;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const lookx = sy * cp, looky = -sp, lookz = cy * cp;
  const rightx = cy, rightz = -sy;
  tmp.v.set(
    player.pos.x - lookx * dist - rightx * shoulder,
    player.pos.y + standH - looky * dist,
    player.pos.z - lookz * dist - rightz * shoulder
  );
  dampV(cam.pos, tmp.v, 16, dt);
  const wish = wishDir();
  cam.roll = damp(cam.roll, -wish.lx * 0.045, 8, dt);
  camera.position.copy(cam.pos);
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw + Math.PI;
  camera.rotation.x = -pitch;
  camera.rotation.z = cam.roll;

  const wantFov = sprinting(wish) ? 67 : 62;
  cam.fov = damp(cam.fov, wantFov, 6, dt);
  if (Math.abs(camera.fov - cam.fov) > 0.05) {
    camera.fov = cam.fov;
    camera.updateProjectionMatrix();
  }
}

function updateHud() {
  const rel = player.reloadT > 0;
  ammoEl.classList.toggle("reloading", rel);
  ammoEl.innerHTML = rel
    ? `REL <span>${player.reloadT.toFixed(1)}s</span>`
    : `${player.mag} <span>/ ${player.reserve}</span>`;
  crossEl.classList.toggle("hit", hitFlash > 0);
}

function frame() {
  const dt = Math.min(0.033, clock.getDelta());
  if (pointerReady) {
    updateLook(dt);
    updateMove(dt);
    updateShoot(dt);
  }
  updateDummies(dt);
  updateSoldier(dt);
  updateCamera(dt);
  updateFx(dt);
  updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

if (isTouchDevice()) showTouch(true);
requestAnimationFrame(frame);
  </script>
</body>
</html>
